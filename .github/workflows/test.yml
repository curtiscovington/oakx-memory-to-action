name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run answer-blind and research-lock tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Verify frozen public results
        run: python3 scripts/verify_results.py
      - name: Verify generated figures are current
        run: |
          python3 scripts/make_figures.py
          git diff --exit-code -- figures
