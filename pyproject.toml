[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oakx-reuse-study"
version = "0.1.0"
description = "Local, fail-closed evaluation of OAKX knowledge reuse"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Curtis Covington"},
]

[project.urls]
Repository = "https://github.com/curtiscovington/oakx-memory-to-action"

[tool.setuptools.packages.find]
where = ["src"]
